name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, build, size
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A throwaway PostgreSQL for the database tests. Same major version as infra/docker-compose.yml,
    # pinned by digest. Every password here is CI-only, for a database that lives for one run.
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac # 17.11-alpine
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-only-admin-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: tummy_ci
      DB_APP_USER: tummy_app
      DB_APP_PASSWORD: ci-only-app-not-a-secret
      DB_MIGRATOR_USER: tummy_migrator
      DB_MIGRATOR_PASSWORD: ci-only-migrator-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Make the two database users and the database, then migrate from empty. If the database
      # is missing, these steps fail, and so would the tests: database tests never skip.
      - name: Create database users
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: ci_admin
          PGPASSWORD: ci-only-admin-not-a-secret
        run: |
          set -euo pipefail
          command -v psql >/dev/null || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          psql --version
          bash infra/db/init-roles.sh
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:size

  e2e:
    name: End to end and accessibility (phone-sized screen)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A throwaway PostgreSQL for the database tests. Same major version as infra/docker-compose.yml,
    # pinned by digest. Every password here is CI-only, for a database that lives for one run.
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac # 17.11-alpine
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-only-admin-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: tummy_ci
      DB_APP_USER: tummy_app
      DB_APP_PASSWORD: ci-only-app-not-a-secret
      DB_MIGRATOR_USER: tummy_migrator
      DB_MIGRATOR_PASSWORD: ci-only-migrator-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Make the two database users and the database, then migrate from empty. If the database
      # is missing, these steps fail, and so would the tests: database tests never skip.
      - name: Create database users
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: ci_admin
          PGPASSWORD: ci-only-admin-not-a-secret
        run: |
          set -euo pipefail
          command -v psql >/dev/null || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          psql --version
          bash infra/db/init-roles.sh
      - run: pnpm db:migrate
      # The browser tests start the real API, which needs a family-code key. A fresh random one
      # is made for each run, so no key is ever written in this file. APP_ORIGIN and NODE_ENV
      # for that API are set in apps/web/playwright.config.ts.
      - name: Make a throwaway sign-in key for this run
        run: |
          set -euo pipefail
          key="$(openssl rand -base64 32)"
          echo "::add-mask::$key"
          echo "CODE_LOOKUP_SECRET=$key" >> "$GITHUB_ENV"
      - run: pnpm --filter @tummy/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  dependencies:
    name: Dependency audit (npm audit and OSV)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      # OSV-Scanner v2.7.1, downloaded from its GitHub release and checked against a
      # SHA-256 recorded here. No third-party action, no account, no paid plan.
      - name: OSV scan
        run: |
          set -euo pipefail
          curl -fsSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile=pnpm-lock.yaml

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks v8.30.1 from its GitHub release, checked against a recorded SHA-256.
      # The gitleaks-action wrapper needs a paid license for organizations, so it is not used.
      - name: Scan full history
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --verbose
