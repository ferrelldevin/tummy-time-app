# Run the whole stack in containers:
#   docker compose --env-file .env -f infra/docker-compose.yml up --build
# (or `pnpm docker:up`). Copy .env.example to .env first and fill in every password.
# For day-to-day work use `pnpm dev` with a database: docs/runbook.md shows both ways.
name: tummy-time

services:
  db:
    image: postgres:17.11-alpine
    environment:
      # The container's administrator. Used only to create the two users below, on first start.
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Read by infra/db/init-roles.sh (through docker-init.sh) on the first start only.
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_APP_USER: ${DB_APP_USER:?Set DB_APP_USER in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env}
      DB_MIGRATOR_USER: ${DB_MIGRATOR_USER:?Set DB_MIGRATOR_USER in .env}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?Set DB_MIGRATOR_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db:/tummy-db:ro
      - ./db/docker-init.sh:/docker-entrypoint-initdb.d/10-tummy-users.sh:ro
    # No ports: the database is reachable only from the other containers (threat model #24).
    # infra/docker-compose.dev.yml publishes it on this machine's 127.0.0.1 for development.
    healthcheck:
      # Over TCP on purpose: during first-start setup the server listens on its socket only,
      # so this stays unhealthy until setup is finished.
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # Runs the migrations as the migrator user, then exits. The API starts only after it succeeds.
  migrate:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    command: ["node", "dist/cli/migrate.js"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_APP_USER: ${DB_APP_USER:?Set DB_APP_USER in .env}
      DB_MIGRATOR_USER: ${DB_MIGRATOR_USER:?Set DB_MIGRATOR_USER in .env}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?Set DB_MIGRATOR_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      API_PORT: ${API_PORT:?Set API_PORT in .env}
      API_HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # nginx (the web service) is the one proxy in front.
      API_TRUST_PROXY_HOPS: "1"
      # Sign-in settings (docs/runbook.md, section 10). The API refuses to start without them.
      # APP_ORIGIN is the address the web service is published at, below: the page a browser
      # really has open. It is worked out here, not read from .env, where APP_ORIGIN is the
      # address of the `pnpm dev` server.
      AUTH_PROVIDER: family-code-pin
      CODE_LOOKUP_SECRET: ${CODE_LOOKUP_SECRET:?Set CODE_LOOKUP_SECRET in .env}
      APP_ORIGIN: http://127.0.0.1:${DOCKER_WEB_PORT:-8080}
      # The app user only. The API never gets the migrator's password.
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_APP_USER: ${DB_APP_USER:?Set DB_APP_USER in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.API_PORT + '/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    environment:
      API_PORT: ${API_PORT:?Set API_PORT in .env}
    ports:
      # DOCKER_WEB_PORT, not WEB_PORT: WEB_PORT in .env is the `pnpm dev` server's port, and the
      # two must be able to run side by side.
      - "127.0.0.1:${DOCKER_WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
