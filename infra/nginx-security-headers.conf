# The page's own security headers, included in every location that serves the app's files
# (infra/nginx.conf.template). nginx drops every inherited add_header line as soon as a location
# adds one of its own (here, Cache-Control), so each such location includes this file instead
# of relying on inheritance. The API sets its own headers and does not include this.
#
# - Content-Security-Policy: scripts, styles, images, requests, the service worker and the web
#   app manifest only from this server. No inline script, no plugins, no framing, no <base>
#   tricks.
# - Strict-Transport-Security only takes effect over HTTPS, which arrives with the real
#   certificate in Block 8. Browsers ignore it over plain HTTP, so it is safe to send now.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'; connect-src 'self'; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
